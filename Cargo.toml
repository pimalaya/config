[package]
name = "pimalaya-config"
description = "Pimalaya configuration helpers (TOML loader and secret resolution)"
version = "0.0.1"
authors = ["soywod <clement.douin@posteo.net>"]
rust-version = "1.56"
edition = "2021"
license = "MIT"
keywords = ["pimalaya", "config", "toml", "secret"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/pimalaya-config/latest/pimalaya_config"
repository = "https://github.com/pimalaya/config"

[features]
default = []
toml = ["dep:dirs", "dep:serde", "dep:serde-toml-merge", "dep:shellexpand", "dep:toml"]
secret = ["dep:secrecy", "dep:serde", "dep:thiserror"]

[dependencies]
anyhow = "1"
dirs = { version = "6.0", optional = true }
log = "0.4"
secrecy = { version = "0.10", features = ["serde"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde-toml-merge = { version = "=0.3.9", optional = true }
shellexpand = { version = "3.1", optional = true }
thiserror = { version = "2", optional = true }
toml = { version = "0.8", optional = true }
